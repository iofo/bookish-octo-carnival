name: Deploy to GitHub Pages

# Runs automatically on every push to main. This replaces the manual
# "Settings -> Pages -> Deploy from a branch" flow: instead, GitHub builds
# and publishes the site itself on every push, and stamps the exact commit
# it deployed into the page footer — so the live site can never silently
# drift out of sync with what's in the repo. If the footer's short SHA
# matches `git log --oneline -1` locally, Pages is caught up; if it
# doesn't, a deploy is still in flight or something's stuck.
#
# It also stamps that same SHA onto engine.js/ui.js as a cache-busting
# query string (?v=SHA). Without this, browsers/CDNs can keep serving a
# cached copy of the JS after a deploy even though index.html itself
# updates immediately — which looks exactly like a broken feature (new
# markup shows up, but nothing populates it) when it's actually just a
# stale script. Bumping the query string on every deploy forces a fresh
# fetch of both JS files every time, without needing anyone to hard-refresh.
#
# Action versions below are pinned to their current Node.js 24-compatible
# majors (checked against each action's own release notes as of August
# 2026 — see actions/upload-pages-artifact#138/#139 and
# actions/deploy-pages#410 specifically). GitHub is retiring the Node 20
# Actions runtime — Node 24 became the default runner behavior on June 2,
# 2026, and Node 20 support is fully removed on September 16, 2026 — so
# older major versions of these actions will throw deprecation warnings,
# and eventually stop working outright. Note that upload-pages-artifact
# and deploy-pages jumped a full major version (v4 -> v5) specifically for
# this migration, not just a patch bump — a plain "latest patch" update
# wouldn't have picked it up. If warnings return later, check each
# action's GitHub releases page directly for whatever's newer than what's
# pinned here.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you manually trigger a redeploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy runs at a time; a new push cancels a stale queued one
# rather than deploying out of order.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stamp build info into the page footer
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s|id=\"build-info\">local / unbuilt<|id=\"build-info\">${SHORT_SHA} · deployed ${BUILD_DATE}<|" index.html

      - name: Cache-bust engine.js and ui.js
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s|BUILD_SHA_PLACEHOLDER|${SHORT_SHA}|g" index.html

      - name: Upload site as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
